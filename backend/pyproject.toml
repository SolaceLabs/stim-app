[project]
name = "stim-app"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.25",
    "itsdangerous>=2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stim_app*"]
